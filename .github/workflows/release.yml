name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'HMCL-Community/HMCL-CE'
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+)+(-(release|beta|preview)\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
          java-package: jdk+fx
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-cleanup: never
      - name: Prepare release signing key
        shell: bash
        env:
          HMCL_SIGNATURE_KEY_BASE64: ${{ secrets.HMCL_SIGNATURE_KEY_BASE64 }}
        run: |
          if [ -z "$HMCL_SIGNATURE_KEY_BASE64" ]; then
            echo "HMCL_SIGNATURE_KEY_BASE64 is required" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/hmcl-ce-signature-key.pk8"
          printf '%s' "$HMCL_SIGNATURE_KEY_BASE64" | base64 --decode > "$key"
          test -s "$key"
          chmod 600 "$key"
          echo "HMCL_SIGNATURE_KEY=$key" >> "$GITHUB_ENV"
      - name: Verify xvfb
        run: command -v xvfb-run
      - name: Build release artifacts
        run: xvfb-run -a ./gradlew clean :HMCL:build --no-daemon --parallel --stacktrace
        env:
          BUILD_VERSION: ${{ inputs.version }}
          VERSION_TYPE: ${{ inputs.prerelease && 'dev' || 'stable' }}
          MICROSOFT_AUTH_ID: ${{ secrets.CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - name: Verify release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd HMCL/build/libs
          for extension in jar exe sh deb; do
            file="HMCL-CE-$RELEASE_VERSION.$extension"
            test -s "$file"
            test -s "$file.sha256"
            printf '%s  %s\n' "$(tr -d '\r\n' < "$file.sha256")" "$file" | sha256sum -c -
          done
      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: HMCL-CE-${{ inputs.version }}
          path: |
            HMCL/build/libs/HMCL-CE-${{ inputs.version }}.jar*
            HMCL/build/libs/HMCL-CE-${{ inputs.version }}.exe*
            HMCL/build/libs/HMCL-CE-${{ inputs.version }}.sh*
            HMCL/build/libs/HMCL-CE-${{ inputs.version }}.deb*
          if-no-files-found: error
      - name: Generate release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          release_title="HMCL CE ${RELEASE_VERSION/-release./ Release }"
          release_title="${release_title/-beta./ Beta }"
          release_title="${release_title/-preview./ Preview }"
          {
            echo "$release_title"
            echo
            echo "Built and verified by GitHub Actions from commit \`$GITHUB_SHA\`."
            echo
            echo "See the repository README for usage, build instructions, upstream attribution, and license terms."
          } > RELEASE_NOTE.md
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          release_title="HMCL CE ${RELEASE_VERSION/-release./ Release }"
          release_title="${release_title/-beta./ Beta }"
          release_title="${release_title/-preview./ Preview }"
          gh release create "v$RELEASE_VERSION" \
            HMCL/build/libs/HMCL-CE-$RELEASE_VERSION.{jar,exe,sh,deb} \
            HMCL/build/libs/HMCL-CE-$RELEASE_VERSION.{jar,exe,sh,deb}.sha256 \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes-file RELEASE_NOTE.md \
            "${flags[@]}"
